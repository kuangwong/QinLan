services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shiri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shiri
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - shiri-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiri -d shiri']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shiri-db:
